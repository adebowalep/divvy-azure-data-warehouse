<rect x="30" y="116" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#566779" stroke-width="2"/>
<text x="44" y="142" font-size="15" font-weight="700" fill="#0D1B2B" text-anchor="start">Source CSV files</text>
<text x="44" y="169" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">riders.csv  (75,000)</text>
<text x="44" y="186" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">trips.csv  (4,584,921)</text>
<text x="44" y="203" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">payments.csv  (1,946,607)</text>
<text x="44" y="220" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">stations.csv  (838)</text>
<text x="44" y="254" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">Real Divvy trips plus</text>
<text x="44" y="271" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">synthetic rider, account</text>
<text x="44" y="288" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">and payment data</text>
<rect x="300" y="116" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#1783BC" stroke-width="2"/>
<text x="314" y="142" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Azure Database</text>
<text x="314" y="161" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">for PostgreSQL</text>
<text x="314" y="188" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">OLTP source system</text>
<text x="314" y="222" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">tables: rider, trip,</text>
<text x="314" y="239" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">payment, station</text>
<text x="314" y="273" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">loaded with a Python</text>
<text x="314" y="290" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">script (COPY)</text>
<rect x="570" y="116" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#1783BC" stroke-width="2"/>
<text x="584" y="142" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Azure Synapse</text>
<text x="584" y="161" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Ingest</text>
<text x="584" y="188" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">copy data tool</text>
<text x="584" y="205" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">one-time pipeline run</text>
<text x="584" y="239" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">4 copy activities</text>
<text x="584" y="256" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">PostgreSQL to data lake</text>
<rect x="840" y="116" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#1783BC" stroke-width="2"/>
<text x="854" y="142" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Azure Data Lake</text>
<text x="854" y="161" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Storage Gen2</text>
<text x="854" y="188" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">raw: 4 delimited text files</text>
<text x="854" y="205" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">public.rider.txt</text>
<text x="854" y="222" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">public.trip.txt</text>
<text x="854" y="239" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">public.payment.txt</text>
<text x="854" y="256" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">public.station.txt</text>
<text x="854" y="290" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">warehouse/: Parquet output</text>
<text x="854" y="307" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">written by the CETAS step</text>
<rect x="1110" y="116" width="200" height="220" rx="8" fill="#FFFFFF" stroke="#1783BC" stroke-width="2"/>
<text x="1124" y="142" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">Synapse serverless</text>
<text x="1124" y="161" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">SQL pool (built-in)</text>
<text x="1124" y="188" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">database: divvy_dw</text>
<text x="1124" y="222" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">4 external staging tables:</text>
<text x="1124" y="239" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">staging_rider</text>
<text x="1124" y="256" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">staging_trip</text>
<text x="1124" y="273" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">staging_payment</text>
<text x="1124" y="290" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">staging_station</text>
<rect x="1380" y="116" width="330" height="220" rx="8" fill="#0F3A5F" stroke="#0F3A5F" stroke-width="2"/>
<text x="1394" y="142" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">5 CETAS transformations</text>
<text x="1394" y="169" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">CREATE EXTERNAL TABLE ... AS SELECT</text>
<text x="1394" y="203" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">Dimensions</text>
<text x="1394" y="220" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">   dim_rider  ·  dim_station  ·  dim_date</text>
<text x="1394" y="237" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">Facts</text>
<text x="1394" y="254" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">   fact_trip  ·  fact_payment</text>
<text x="1394" y="288" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">Parquet files in warehouse/&lt;table&gt;/run01/</text>
<text x="1394" y="305" font-size="12" font-weight="400" fill="#E6F2FA" text-anchor="start" xml:space="preserve">a new run folder for every re-run</text>
<rect x="30" y="625" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#566779" stroke-width="2"/>
<text x="44" y="651" font-size="15" font-weight="700" fill="#0D1B2B" text-anchor="start">Source CSV files</text>
<text x="44" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">the same four files,</text>
<text x="44" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">read locally</text>
<text x="44" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">not stored in the</text>
<text x="44" y="746" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">repository</text>
<rect x="300" y="625" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<text x="314" y="651" font-size="15" font-weight="700" fill="#7A4F0E" text-anchor="start">Python aggregation</text>
<text x="314" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">dashboard/build_data.py</text>
<text x="314" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">pandas + NumPy</text>
<text x="314" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">same business rules as</text>
<text x="314" y="746" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">the warehouse SQL</text>
<rect x="570" y="625" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<text x="584" y="651" font-size="15" font-weight="700" fill="#7A4F0E" text-anchor="start">data.json</text>
<text x="584" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">aggregates only</text>
<text x="584" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">about 311 KB</text>
<text x="584" y="712" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">no rider-level rows</text>
<text x="584" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">split by rider type</text>
<rect x="840" y="625" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<text x="854" y="651" font-size="15" font-weight="700" fill="#7A4F0E" text-anchor="start">Static page build</text>
<text x="854" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">make_dashboard.py +</text>
<text x="854" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">template.html</text>
<text x="854" y="712" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">makes dashboard/index.html</text>
<text x="854" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">data embedded</text>
<rect x="1110" y="625" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/>
<text x="1124" y="651" font-size="15" font-weight="700" fill="#115C3B" text-anchor="start">GitHub Pages</text>
<text x="1124" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">static hosting from</text>
<text x="1124" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">the main branch</text>
<text x="1124" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">no database,</text>
<text x="1124" y="746" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">no backend</text>
<rect x="1380" y="625" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#1B8A5A" stroke-width="2"/>
<text x="1394" y="651" font-size="15" font-weight="700" fill="#115C3B" text-anchor="start">Divvy Ride Atlas</text>
<text x="1394" y="678" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">runs in the visitor&#x27;s browser:</text>
<text x="1394" y="695" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">rider-type filter, 7 tabs,</text>
<text x="1394" y="712" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">heatmap, station map, routes,</text>
<text x="1394" y="729" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">rebalancing, payments, accounts</text>
<rect x="1110" y="382" width="600" height="99" rx="8" fill="#FFFFFF" stroke="#1783BC" stroke-width="2"/>
<text x="1124" y="408" font-size="15" font-weight="700" fill="#0F3A5F" text-anchor="start">T-SQL analytics and validation (serverless SQL)</text>
<text x="1124" y="435" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">07_business_queries.sql: ride duration, stations, routes, spend, usage vs spend</text>
<text x="1124" y="452" font-size="12" font-weight="400" fill="#0D1B2B" text-anchor="start" xml:space="preserve">06_validation_summary.sql: 26 checks, all passing in the Synapse run</text>
